<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PCRP TV Gateway</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #player {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #000;
        }

        #error {
            display: none;
            position: absolute;
            inset: 0;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            box-sizing: border-box;

            color: white;
            background: black;

            font-family: Arial, sans-serif;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <div id="player"></div>
    <div id="error"></div>

    <script>
        (function () {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const youtubeId =
                params.get("v");

            const twitchChannel =
                params.get("t");

            const player =
                document.getElementById("player");

            const error =
                document.getElementById("error");


            function showError(message) {
                player.innerHTML = "";

                error.textContent = message;
                error.style.display = "flex";
            }


            // ==========================================
            // TWITCH
            // ==========================================

            if (twitchChannel) {

                if (
                    !/^[A-Za-z0-9_]+$/.test(
                        twitchChannel
                    )
                ) {
                    showError(
                        "Invalid Twitch channel."
                    );

                    return;
                }


                const iframe =
                    document.createElement("iframe");


                iframe.src =
                    "https://player.twitch.tv/" +
                    "?channel=" +
                    encodeURIComponent(
                        twitchChannel
                    ) +
                    "&parent=mpers13.github.io" +
                    "&autoplay=true" +
                    "&muted=false";


                iframe.allow =
                    "autoplay; fullscreen";


                iframe.allowFullscreen = true;


                player.appendChild(
                    iframe
                );


                return;
            }


            // ==========================================
            // YOUTUBE
            // ==========================================

            if (youtubeId) {

                if (
                    !/^[A-Za-z0-9_-]{11}$/.test(
                        youtubeId
                    )
                ) {
                    showError(
                        "Invalid YouTube video ID."
                    );

                    return;
                }


                const iframe =
                    document.createElement("iframe");


                iframe.src =
                    "https://www.youtube.com/embed/" +
                    encodeURIComponent(
                        youtubeId
                    ) +
                    "?autoplay=1" +
                    "&controls=0" +
                    "&rel=0" +
                    "&playsinline=1" +
                    "&mute=0";


                iframe.allow =
                    "autoplay; encrypted-media; picture-in-picture; fullscreen";


                iframe.allowFullscreen = true;


                iframe.referrerPolicy =
                    "strict-origin-when-cross-origin";


                player.appendChild(
                    iframe
                );


                return;
            }


            // ==========================================
            // NO SOURCE
            // ==========================================

            showError(
                "No media source provided."
            );

        })();
    </script>

</body>
</html>
