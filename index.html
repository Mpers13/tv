<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PCRP Media Gateway</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #player {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #player iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        #error {
            display: none;
            position: absolute;
            inset: 0;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            box-sizing: border-box;
            color: #fff;
            background: #000;
            font-family: Arial, sans-serif;
            font-size: 22px;
        }
    </style>

    <!-- Official Twitch Embed SDK -->
    <script src="https://player.twitch.tv/js/embed/v1.js"></script>
</head>

<body>

    <div id="player"></div>
    <div id="error"></div>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);

            const youtubeId = params.get("v");
            const twitchChannel = params.get("t");

            const playerContainer = document.getElementById("player");
            const errorContainer = document.getElementById("error");

            function showError(message) {
                playerContainer.innerHTML = "";

                errorContainer.textContent = message;
                errorContainer.style.display = "flex";
            }

            function sanitizeYouTubeId(value) {
                if (!value) return null;

                // Standard YouTube video IDs are 11 characters.
                if (/^[A-Za-z0-9_-]{11}$/.test(value)) {
                    return value;
                }

                return null;
            }

            function sanitizeTwitchChannel(value) {
                if (!value) return null;

                // Twitch channel names are normally letters,
                // numbers and underscores.
                if (/^[A-Za-z0-9_]+$/.test(value)) {
                    return value;
                }

                return null;
            }

            // ==========================================
            // TWITCH
            // ==========================================

            if (twitchChannel) {
                const channel = sanitizeTwitchChannel(twitchChannel);

                if (!channel) {
                    showError("Invalid Twitch channel.");
                    return;
                }

                if (typeof Twitch === "undefined" || !Twitch.Player) {
                    showError("Twitch player failed to load.");
                    return;
                }

                try {
                    new Twitch.Player("player", {
                        width: "100%",
                        height: "100%",
                        channel: channel,
                        autoplay: true,
                        muted: false,

                        // GitHub Pages hostname.
                        // window.location.hostname ensures this matches
                        // the actual page hosting this gateway.
                        parent: [
                            window.location.hostname
                        ]
                    });
                } catch (error) {
                    console.error("Twitch player error:", error);
                    showError("Unable to load Twitch stream.");
                }

                return;
            }

            // ==========================================
            // YOUTUBE
            // ==========================================

            if (youtubeId) {
                const id = sanitizeYouTubeId(youtubeId);

                if (!id) {
                    showError("Invalid YouTube video ID.");
                    return;
                }

                const iframe = document.createElement("iframe");

                iframe.src =
                    "https://www.youtube.com/embed/" +
                    encodeURIComponent(id) +
                    "?autoplay=1" +
                    "&controls=0" +
                    "&rel=0" +
                    "&playsinline=1" +
                    "&mute=0";

                iframe.allow =
                    "autoplay; encrypted-media; picture-in-picture";

                iframe.allowFullscreen = true;

                iframe.referrerPolicy =
                    "strict-origin-when-cross-origin";

                iframe.style.width = "100%";
                iframe.style.height = "100%";
                iframe.style.border = "0";

                playerContainer.appendChild(iframe);

                return;
            }

            // ==========================================
            // NOTHING PROVIDED
            // ==========================================

            showError("No media source provided.");
        })();
    </script>

</body>
</html>
